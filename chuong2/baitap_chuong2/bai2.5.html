<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bài 2.5</title>
    <style>
        .header { display: flex; justify-content: space-between; text-align: center; font-weight: bold; font-size: 14px;}
        .title { text-align: center; font-family: Verdana; font-size: 20px; color: red; font-weight: bold; margin: 20px 0;}
        .form-section { display: flex; margin-bottom: 20px; }
        .form-inputs { flex-grow: 1; padding-left: 20px; display: flex; flex-direction: column; justify-content: center;}
        .form-row { margin-bottom: 5px; display: flex; align-items: center;}
        .label { width: 100px; text-align: right; padding-right: 10px;}
        .hardware-title { border-top: 2px solid black; border-bottom: 2px solid black; background-color: #d3d3d3; text-align: center; font-weight: bold; padding: 5px; margin-top: 20px; margin-bottom: 20px;}
        .hard-label { font-weight: bold; margin-bottom: 5px;}
    </style>
</head>
<body>
    <fieldset>
        <legend>Đăng ký thể thao</legend>
        <div class="header">
            <div>
                TRƯỜNG ĐẠI HỌC BẠC LIÊU<br>
                KHOA KỸ THUẬT VÀ CÔNG NGHỆ
            </div>
            <div>
                CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM<br>
                <span style="font-weight: normal; font-size: 12px; text-decoration: underline;">Độc lập - Tự do - Hạnh phúc</span>
            </div>
        </div>
        
        <div class="title">PHIẾU ĐĂNG KÝ DỰ THI THỂ THAO</div>

        <form>
            <div class="form-section">
                <!-- Thay placeholder này bằng ảnh logo thật nếu có -->
                <img src="https://via.placeholder.com/150x80?text=Bac+Lieu+University" alt="Logo" style="border: 1px solid #000;">
                <div class="form-inputs">
                    <div class="form-row">
                        <div class="label">Họ tên:</div>
                        <div><input type="text" style="width: 200px;"></div>
                    </div>
                    <div class="form-row">
                        <div class="label">Mật khẩu:</div>
                        <div><input type="password" style="width: 200px;"></div>
                    </div>
                </div>
            </div>

            <div style="font-weight: bold; margin-bottom: 5px;">Môn thể thao:</div>
            <div style="margin-left: 20px;">
                <div><input type="checkbox" id="bd"> <label for="bd">Bóng đá</label></div>
                <div><input type="checkbox" id="bc"> <label for="bc">Bóng chuyền</label></div>
                <div><input type="checkbox" id="dk"> <label for="dk">Điền kinh</label></div>
                <div><input type="checkbox" id="bl"> <label for="bl">Bơi lội</label></div>
            </div>

            <div class="hardware-title">
                PHẦN CỨNG MÁY TÍNH
            </div>

            <div style="margin-bottom: 10px;">
                <div class="hard-label">Thiết bị:</div>
                <select multiple size="4" style="width: 150px;">
                    <option>CPU</option>
                    <option>Mainboard</option>
                    <option>ASUS DVD</option>
                    <option>RAM KingMax</option>
                </select>
            </div>
            
            <div style="margin-bottom: 15px;">
                <div class="hard-label">Thời gian bảo hành:</div>
                <select style="width: 150px;">
                    <option></option>
                    <!-- có thể thêm option 1 năm, 2 năm -->
                </select>
            </div>

            <div>
                <button type="submit">Submit</button>
                <button type="reset" style="margin-left: 5px;">Reset</button>
            </div>
        </form>
    </fieldset>
</body>
</html>
