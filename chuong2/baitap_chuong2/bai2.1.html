<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>bai2.1</title>
</head>
<body>
    <!-- 
    fieldset: Dùng để nhóm các nội dung lại với nhau và tạo ra một đường viền bao quanh.
    legend: Là tiêu đề hiển thị chèn lên đường viền của thẻ fieldset.
    div: Tạo một khối chứa nội dung, ở đây có dùng style="text-align: center;" để căn giữa mọi thứ bên trong.
    p: Thẻ đoạn văn (paragraph). Các thuộc tính style bên trong dùng để CSS: font-family (đổi font), font-size (đổi cỡ chữ), font-weight (chỉnh độ đậm), color (đổi màu), font-style (chữ nghiêng).
    -->
    <fieldset>
        <legend>Công ty du lịch Bạc Liêu</legend>
        <div style="text-align: center;">
            <p style="font-family: Tahoma; font-size: 25px; font-weight: bold; color: red; margin: 10px 0;">DU LỊCH BẠC LIÊU</p>
            <p style="font-family: 'Times New Roman', Times, serif; font-size: 15px; font-weight: bold; font-style: italic; margin: 10px 0;">Kính chào quý khách!</p>
        </div>
    </fieldset>
</body>
</html>
