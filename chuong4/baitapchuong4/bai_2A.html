<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chương4 bài 2A</title>
  </head>
  <body>
    <script language="javascript">
      document.write("<h1> Tạo button bằng script </h1><br>");
      document.write("<br>");
      function Tbao(txt) {
        alert(txt);
      }
    </script>
    <form>
      <!-- name dùng để định danh để k bị trùng vs tên khác 
       value nd bên trong là j thì nút bấm là casi đó
       onclick khi click vào nd của value thì nó hiện ra dòng chữ bên trng tbao -->
      <input
        type="button"
        name="ahgfhsfdh" 
        value="bấm vào đi bro"
        onclick="Tbao('tôi đang học js')"
      />
    </form>
  </body>
</html>
