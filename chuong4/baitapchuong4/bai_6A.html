<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tính tuổi</title>
  </head>
  <body>
    <script>
      var D = new Date();
      var namsinh, namhientai;
      namhientai = D.getFullYear();
      namsinh = prompt("Nhập năm sinh của bạn: ", "");
      alert("Tuổi của bạn bây h là: " + (namhientai - namsinh));
    </script>
  </body>
</html>
