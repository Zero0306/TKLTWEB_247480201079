<html lang="en">
  <head>

    <title>Document</title>

  <body>
    <script language="javascript">
      var D = new Date();
      var ngay = D.getDate();
      var thang = D.getMonth() + 1;
      var nam = D.getFullYear();
      document.write(
        "<h2> Hôm nay là : " + ngay + "/" + thang + "/" + nam + "</h2>",
      );
    </script>
  </body>
