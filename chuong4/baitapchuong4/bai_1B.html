<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bai_1B</title>
  </head>
  <body>
    <script language="javascript">
      /* 
       Giải thích lệnh JavaScript cơ bản:
       - var: dùng để khai báo biến, nơi lưu trữ dữ liệu (ví dụ lưu tên, lớp).
       - prompt("câu hỏi", "giá trị mặc định"): hiện lên một hộp thoại có ô nhập chữ để người dùng nhập vào.
       - document.write("Nội dung"): in hoặc viết thẳng mã HTML / chữ cái vào trang web hiện tại.
      */
      var Hoten = prompt("Nhập họ tên của bạn: ", "");/* prompt hiện hộp thoại cho phép nhập tên */
      var lop = prompt("Nhập lớp của bạn: ", "");

      document.write("<h1 style='color: red;'> TRƯỜNG ĐẠI HỌC BẠC LIÊU </h1>"); /* in nd ra mhinh vơi các thuộc tính */
      document.write("<h1 style='color: blue;'> KHOA KỸ THUẬT CÔNG NGHỆ </h1>");
      document.write(
        "<font color='black' size='4'> <b>Lớp học: " +
          lop +
          " <b> </font> <br>",
      );
      document.write(
        "<font color='green' size='4'> <b>Họ và tên: " +
          Hoten +
          " <b> </font> <br>",
      );
    </script>
  </body>
</html>
