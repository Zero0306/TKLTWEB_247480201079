<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài tập 1B</title>
  </head>
  <body>
    <script language="javascript">
      var Hoten = prompt("Nhập họ tên của bạn: ", "");
      var lop = prompt("Nhập lớp của bạn: ", "");

      document.write("<h1 style='color: red;'> TRƯỜNG ĐẠI HỌC BẠC LIÊU </h1>");
      document.write("<h1 style='color: blue;'> KHOA KỸ THUẬT CÔNG NGHỆ </h1>");
      document.write(
        "<font color='black' size='4'> <b>Lớp học: " +
          lop +
          " <b> </font> <br>",
      );
      document.write(
        "<font color='green' size='4'> <b>Họ và tên: " +
          Hoten +
          " <b> </font> <br>",
      );
    </script>
  </body>
</html>
