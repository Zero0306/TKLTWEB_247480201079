<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
  </head>
  <body>
    <script language="javascript">
      var luachon = prompt("Hãy nhập vào 1 số để mở trang web: ", 1);
      switch (luachon) {
        case "1":
          window.open("https://blu.com.vn");
          break;
        case "2":
          window.open("https://ctu.edu.vn");
          break;
        case "3":
          window.open("https://vndoc.com.vn");
          break;
        default:
          alert("http://meta.vn");
      }
    </script>
  </body>
</html>
