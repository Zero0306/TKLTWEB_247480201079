<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bai3.1</title>
  </head>
  <body>
    <!-- 
     Giải thích CSS cơ bản:
     - font-family: kiểu chữ (ví dụ Times New Roman)
     - font-size: kích cỡ chữ
     - font-weight: độ đậm nhạt của nét chữ (bold là in đậm)
     - background-color: tô màu nền
     - color: màu chữ
     
     Giải thích thẻ HTML trong bài:
     - table: tạo một bảng. border="1" tạo đường viền mỏng, width="100%" bảng rộng hết màn hình.
     - tr (table row): tạo một hàng trong bảng.
     - th (table header): tạo một ô tiêu đề trong hàng, mặc định chữ in đậm và căn giữa. align="left" ép nó căn trái.
      -->
    <table border="1" width="100%">
      <tr>
        <th align="left">
          <h1 style="color: red">TRƯỜNG ĐẠI HỌC BẠC LIÊU</h1>
          <h2 style="color: blue">KHOA CÔNG NGHỆ THÔNG TIN</h2>
          <h3 style="color: green">BỘ MÔN KHOA HỌC MÁY TÍNH</h3>
          <p
    
            style="
              font-family: Times New Roman;
              font-size: 14px;
              font-weight: bold;
              text-align: left;
            "
          >
            LỚP 13DTH1
          </p>
          <br />
          <p
            style="
              font-family:
                Times New Roman,
                Times,
                serif;
              font-size: 12px;
              font-weight: bold;
              background-color: yellow;
            "
          >
            Ngành công nghệ thông tin năm thứ 3
          </p>
        </th>
      </tr>
    </table>
  </body>
</html>
