<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>side</title>
<style>
p {
  border-top-style: dotted;
  border-right-style: solid;
  border-bottom-style: dotted;
  border-left-style: solid;
}
</style>
</head>
<body>
<!-- 
  border-top-style: Kiểu đường viền ở cạnh trên (dotted là nét đứt)
  border-right-style: Kiểu đường viền ở cạnh phải (solid là nét liền)
  border-bottom-style: Kiểu đường viền ở cạnh dưới
  border-left-style: Kiểu đường viền ở cạnh trái
-->
<h2>Individual Border Sides</h2>
<p>2 different border styles.</p>

</body>
</html>
